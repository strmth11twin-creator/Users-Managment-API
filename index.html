<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Users-Managment</title>
</head>

<body>


    <div class="container" data-container>

        <aside class="sidebar" data-sidebar>
            <div class="wrapper">
                    <button class="cross-btn" data-cross-btn>
                        <svg class="cross-icon">
                            <use href="svg-icons/x_cross_delete_remove_icon_144023.svg"></use>
                        </svg>
                    </button>

                <div class="sidebar_header">
                    <button class="sidebar_button">
                        <svg class="managment-icon">
                            <use href="svg-icons/group-profile-users_icon-icons.com_73540.svg"></use>
                        </svg>
                    </button>

                    <h2 class="sidebar_title">Users-Managment</h2>
                </div>

                <nav class="sidebar_navigation" data-sidebar-navigation>
                    <div class="sidebar_navigation--container active" data-filter="all">
                        <svg class="users-icon">
                            <use href="svg-icons/user_icon_150670.svg"></use>
                        </svg>

                        <p class="sidebar_navigation--item">Users</p>
                    </div>

                    <div class="sidebar_navigation--container" data-filter="admins">
                        <svg class="users-icon">
                            <use href="svg-icons/administrator_solid_icon_236304.svg"></use>
                        </svg>

                        <p class="sidebar_navigation--item">Administrators</p>
                    </div>

                    <div class="sidebar_navigation--container" data-filter="moderators">
                        <svg class="users-icon">
                            <use href="svg-icons/Moderator_icon-icons.com_55860.svg"></use>
                        </svg>

                        <p class="sidebar_navigation--item">Moderators</p>
                    </div>
                </nav>
            </div>
        </aside>


        <div class="container_wrapper">
            <div class="container_wrapper--title">
                <div class="title_wrapper">
                    <h2 class="wrapper_title">Users</h2>
                    <p class="wrapper_desc">Manage all users im your system</p>
                </div>

                <button class="button-change">
                    <svg class="sun">
                        <use href="svg-icons/sun-day-weather-symbol_icon-icons.com_73146.svg"></use>
                    </svg>
                </button>
            </div>

            <div class="container_wrapper--content">
                <div class="container_search--input">
                    <svg class="search">
                        <use href="svg-icons/searchmagnifierinterfacesymbol1_79893 (1).svg"></use>
                    </svg>
                    <input type="text" class="search-input" placeholder="Search Users..." data-search-input>
                </div>
                <button class="add-btn" data-add-btn>
                    <svg class="plus-icon">
                        <use href="svg-icons/plus_icon-icons.com_72294.svg"></use>
                    </svg>

                    Add User
                </button>
            </div>

            <main class="hero">
                <div class="hero_container">
                    <button class="hero_container-btn">
                        <svg class="hero_container-icon">
                            <use href="svg-icons/users_icon-icons.com_57999.svg"></use>
                        </svg>
                    </button>

                    <div class="hero_container--wrapper">
                        <span class="all-count" data-all-count>0</span>
                        <p class="wrapper_text">Total Users</p>
                    </div>
                </div>

                <div class="hero_container">
                    <button class="hero_container-btn  active-user">
                        <svg class="hero_container-icon active-icon">
                            <use href="svg-icons/activity_user_icon_217138.svg"></use>
                        </svg>
                    </button>

                    <div class="hero_container--wrapper">
                        <span class="all-count" data-active-count>0</span>
                        <p class="wrapper_text">Active Users</p>
                    </div>
                </div>

                <div class="hero_container">
                    <button class="hero_container-btn admin">
                        <svg class="hero_container-icon admin-icon">
                            <use href="svg-icons/seo-social-web-network-internet_07_icon-icons.com_61538.svg"></use>
                        </svg>
                    </button>

                    <div class="hero_container--wrapper">
                        <span class="all-count" data-admins-count>0</span>
                        <p class="wrapper_text">All Admins</p>
                    </div>
                </div>

                <div class="hero_container">
                    <button class="hero_container-btn  inactive-user">
                        <svg class="hero_container-icon inactive-icon">
                            <use href="svg-icons/profile_picture_user_icon_153847.svg"></use>
                        </svg>
                    </button>

                    <div class="hero_container--wrapper">
                        <span class="all-count" data-inactive-count>0</span>
                        <p class="wrapper_text">Inactive Users</p>
                    </div>
                </div>
            </main>

            <div class="container_users" data-container-users></div>
        </div>
    </div>

    <dialog class="user-dialog" data-user-dialog></dialog>

    <div class="modal" data-modal>
        <form data-form class="form">
            <div class="modal_container">
                <h3 class="modal_container--title">Add User</h3>
                <button class="modal_container--remove-btn" data-modal-remove-btn type="button">X</button>
            </div>

            <div class="modal_container--control">
                <label for="name-id" class="control_label">Name</label>
                <input type="text" class="control_input" id="name-id" name="userName" placeholder="Enter Name" required>
            </div>

            <div class="modal_container--control">
                <label for="email-id" class="control_label">Email</label>
                <input type="email" class="control_input" id="email-id" name="userEmail" placeholder="Enter Email"
                    required>
            </div>

            <div class="modal_container--control">
                <label for="role-id" class="control_label">Role</label>
                <select name="userRole" id="role-id" class="control_input" required>
                    <option value="" class="option" disabled selected>Select role</option>
                    <option value="User" class="option">User</option>
                    <option value="Admin" class="option">Admin</option>
                    <option value="Moderator" class="option">Moderator</option>
                </select>
            </div>

            <div class="modal_container--control">
                <label for="status-id" class="control_label">Status</label>
                <select name="userStatus" id="status-id" class="control_input" required>
                    <option value="" class="option" disabled selected>Select status</option>
                    <option value="Active" class="option">Active</option>
                    <option value="Inactive" class="option">Inactive</option>
                </select>
            </div>

            <div class="modal_container--control">
                <label for="image-id" class="control_label">Image</label>
                <select name="userImage" id="image-id" class="control_input" required>
                    <option value="" class="option" disabled selected>Images Url</option>
                    <option

                        class="option">Фотография 3</option>
                    <option
                        value="https://images.openai.com/static-rsc-4/rVbtyMaYB4BXKgkpMrGxmWXhseSXnoxefbBUtq-inLYPFYzTH0FRnm-8fu2qwtyTJrPsJ4vVRoI35hX-UiIaA1TXaMpr7SOTwfP0VMFEsMXTk5DRrjDTiPu_rlrdJhl6NCnFQdX2l40h97WVrqwz2j6wn345C4oyObsaTdI96xae1NapjRasjRi1DYvH83IN?purpose=fullsize"

                        class="option">Фотография 7</option>

                </select>
            </div>

            <div class="modal_container--buttons">
                <button class="cancel-btn" data-modal-cancel-btn type="button">Cancel</button>
                <button class="create-btn" type="submit">Create User</button>
            </div>
        </form>
    </div>


    <template data-user-template>
        <div class="user-card">
            <img src="" alt="" class="user-image" data-user-image>
            <p class="user-name" data-user-name></p>
            <p class="user-email" data-user-email></p>
            <span class="user-role" data-user-role></span>
            <span class="user-status" data-user-status></span>
            <div class="user-card_buttons">
                <button class="edit-btn" data-edit-btn>
                    <svg class="edit-icon">
                        <use href="svg-icons/edit_icon-icons.com_61193.svg"></use>
                    </svg>

                    Edit
                </button>
                <button class="remove-btn" data-remove-btn>
                    <svg class="remove-icon">
                        <use href="svg-icons/seo-social-web-network-internet_262_icon-icons.com_61518 (1).svg"></use>
                    </svg>

                    Delete
                </button>
            </div>
        </div>
    </template>
</body>

</html>
